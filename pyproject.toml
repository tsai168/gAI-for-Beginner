[project]
name = "cpo-ai"
version = "0.0.0"
description = "CPO AI — 台灣 CPO／矽光子產業研究 AI Agent 系統（Foundation）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "temporalio>=1.7",
    "anthropic>=0.34",
    "httpx>=0.27",
    "structlog>=24.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/ingestion",
    "src/knowledge",
    "src/models",
    "src/agents",
    "src/workflows",
    "src/reports",
    "src/governance",
    "src/api",
    "src/ui",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.pylint]
max-args = 10  # keyword-only ingestion/model helpers legitimately take many

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # literal values in assertions are fine in tests

[tool.mypy]
python_version = "3.12"
mypy_path = "."
packages = ["ingestion", "knowledge", "models", "agents", "workflows", "reports", "governance", "api", "ui"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
explicit_package_bases = true
exclude = [
    'src/models/.*',
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs Postgres + Temporal dev (docker compose up)",
    "migration: exercises Alembic migrations against a live DB",
]
addopts = "-ra"
